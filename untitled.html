function cari(q){q=q.toLowerCase();document.querySelectorAll('#lst .card').forEach(c=>c.style.display=c.dataset.n.includes(q)?'':'none')}
window.cari=cari;
let last='';
function route(){const k=location.hash.replace('#/','')||'home',f=P[k]||P.home,v=$('#view');
 const same=k==last;last=k;v.innerHTML=`<div class="${same?'':'pg'}">${f()}</div>`;if(!same)window.scrollTo({top:0,behavior:'smooth'})}
addEventListener('hashchange',route);route();

/* ===== LATAR BERGERAK ===== */
const c=$('#sky'),x=c.getContext('2d');let W,H,S=[],sh=[];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;S=Array.from({length:Math.min(220,W*H/5000|0)},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+.3,t:Math.random()*6}))}
function loop(){x.clearRect(0,0,W,H);
 for(const s of S){s.y+=s.z*.18;s.x+=s.z*.06;if(s.y>H)s.y=0;if(s.x>W)s.x=0;s.t+=.03;x.globalAlpha=.35+.65*Math.abs(Math.sin(s.t));x.fillStyle=s.z>1.7?'#9be3ff':'#fff';x.beginPath();x.arc(s.x,s.y,s.z*.7,0,7);x.fill()}
 if(Math.random()<.01)sh.push({x:Math.random()*W+W*.3,y:Math.random()*H*.4,l:0});
 sh=sh.filter(m=>m.l<55);
 for(const m of sh){m.x-=9;m.y+=5;m.l++;const g=x.createLinearGradient(m.x,m.y,m.x+70,m.y-39);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,255,255,0)');x.globalAlpha=1-m.l/55;x.strokeStyle=g;x.lineWidth=2;x.beginPath();x.moveTo(m.x,m.y);x.lineTo(m.x+70,m.y-39);x.stroke()}
 requestAnimationFrame(loop)}
addEventListener('resize',rs);rs();loop();
</script>
